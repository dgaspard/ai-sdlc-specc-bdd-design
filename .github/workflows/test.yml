name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bdd:
    name: BDD — Cucumber + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser-level behavior specifications
        run: npm run test:bdd

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  api-contract:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify visit-cancellation contract
        run: npm run test:contract

  observability:
    name: Observability contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify visit-cancellation telemetry
        run: npm run test:observability

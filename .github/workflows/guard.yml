name: Guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    # Required check (GUARD-01): protected specs and tests match the human-frozen manifest.
    name: Protected specs and tests unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spec/package-lock.json
      - run: npm --prefix spec ci
      - run: npm --prefix spec run guard:check

  suite:
    # Informational until the application exists; not a required check yet.
    name: Full test suite (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spec/package-lock.json
      - run: npm --prefix spec ci
      - run: npm test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

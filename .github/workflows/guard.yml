name: Guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    # Required check (GUARD-01): protected specs and tests match the human-frozen manifest.
    name: Protected specs and tests unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spec/package-lock.json
      - run: npm --prefix spec ci
      - run: npm --prefix spec run guard:check

  delivery:
    name: Delivery spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spec/delivery/package-lock.json
      - run: npm --prefix spec/delivery ci && npm --prefix spec/delivery test

  suite:
    # Informational until the application exists; not a required check yet.
    name: Full test suite (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            spec/package-lock.json
            services/platform/package-lock.json
      - run: npm --prefix spec ci
      # Runtime contract RT-001: each project's setup installs its own dependencies (the
      # services share services/platform). Language-neutral: a rebuilt Python service's
      # setup works the same way.
      - run: for s in services/*/setup frontend/setup; do (cd "$(dirname "$s")" && ./setup); done
      - run: npx --prefix spec playwright install --with-deps chromium
      - run: npm test
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

rules:
  # Name heuristic. Hardened 2026-10-05 after ENG-02 calibration (CAL-13):
  # every console method, plus names for credentials carried in headers.
  - id: secret-logged-js
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Logging a value whose name suggests it holds a secret, token, password,
      or request credentials. Remove it from the log call, or log a redacted
      placeholder instead.
    metadata:
      defect-class: "SEC-01 #2"
    patterns:
      - pattern: console.$M(..., $X, ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(log|error|warn|info|debug|trace)$
      - metavariable-regex:
          metavariable: $X
          regex: (?i)^[\w.$\[\]"']*(secret|token|password|passwd|signing|authorization|bearer|credential|cookie|apikey|api_key|header)\w*$

  # Dataflow: anything read from request headers (which carry the bearer
  # token) that reaches a log call, whatever it is called on the way. Added
  # 2026-10-05; CAL-13 logged `header`, a parameter holding the raw
  # Authorization header.
  - id: request-credentials-logged-js
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A value read from request headers reaches a log call. Request headers
      carry bearer tokens and cookies; log a reason code instead.
    metadata:
      defect-class: "SEC-01 #2"
    mode: taint
    pattern-sources:
      - pattern: $REQ.headers
      - pattern: $REQ.headers.authorization
      - pattern: $REQ.headers["authorization"]
      - pattern: $REQ.headers.cookie
      - pattern: $REQ.get("authorization")
    pattern-sinks:
      - patterns:
          - pattern: console.$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(log|error|warn|info|debug|trace)$

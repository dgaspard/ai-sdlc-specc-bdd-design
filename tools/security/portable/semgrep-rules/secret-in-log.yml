rules:
  - id: secret-logged-js
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Logging a variable whose name suggests it holds a secret, token, or
      password. Remove it from the log call, or log a redacted placeholder
      instead.
    metadata:
      defect-class: "SEC-01 #2"
    patterns:
      - pattern-either:
          - pattern: console.log(..., $X, ...)
          - pattern: console.error(..., $X, ...)
          - pattern: console.warn(..., $X, ...)
      - metavariable-regex:
          metavariable: $X
          regex: (?i).*(secret|token|password|signing).*

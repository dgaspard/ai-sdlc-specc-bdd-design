# SPEC-08 environment catalog: what runs in Local, Non-prod and Prod, and why.
# Source of truth for docs/delivery/environments.md (rendered; never edit that file).
#
# Each entry:
#   status: enforced (scenarios or existing checks prove it) | planned (no check yet,
#           an explicit gap) | deferred (deliberately out of scope for now)
#   environments.<env>.use: required | informational | not-used, plus why
#   controls: CTL IDs of the scenarios that enforce it (features/**/*.feature)
#   existing_checks: repository paths of checks that predate SPEC-08
# The catalog checks (features/catalog) fail if any of this drifts.

version: 1
region: us-east-1
budget_usd: 25
# Decided 2026-10-10: minutes after creation. Non-prod lives long enough to be tested;
# prod lives long enough for a human to look at it.
ttl_minutes:
  nonprod: 15
  prod: 30
rendered_doc: docs/delivery/environments.md
# @awaiting:<ID> tags must name a "### <ID> —" heading here.
backlog_file: BACKLOG.md

environments:
  local: >-
    The agent's fast loop and the developer's laptop. Same images as the cloud,
    started with Docker Compose, test endpoints on, OTLP test collector, payment fake.
    Static and template checks run here; nothing needs AWS credentials.
  nonprod: >-
    An ephemeral AWS member account environment created by CI on merge, tested with the
    live tier, then destroyed when its TTL expires. Test endpoints stay on: this is a test
    application with no real data.
  prod: >-
    A production-shaped AWS member account environment. It runs only images already
    proven in non-prod, after a human approves, for a short promotion window before
    teardown. Test endpoints are off.

entries:
  # --- Build and package ---------------------------------------------------------
  - id: container-images
    name: Hardened container images
    kind: practice
    tools: [Docker]
    purpose: One image per runnable project, built once and promoted unchanged.
    status: enforced
    controls: [CTL-001, CTL-002, CTL-003, CTL-004]
    environments:
      local: { use: required, why: "The same image runs locally and in the cloud, so local results carry over." }
      nonprod: { use: required, why: Non-prod tests the exact image prod will run. }
      prod: { use: required, why: Prod runs only images built and tested earlier. }
    cost: Free to build; ECR storage costs cents per month.

  - id: local-compose
    name: Local system in one command
    kind: tool
    tools: [Docker Compose]
    purpose: Start every project plus the payment fake and the OTLP test collector.
    status: enforced
    controls: [CTL-005]
    environments:
      local: { use: required, why: Gives agents and developers the whole system without cloud access. }
      nonprod: { use: not-used, why: ECS runs the images in the cloud. }
      prod: { use: not-used, why: ECS runs the images in the cloud. }
    cost: Free.

  # --- Pipeline -----------------------------------------------------------------
  - id: workflow-hardening
    name: Least-privilege, pinned workflows
    kind: practice
    tools: [GitHub Actions]
    purpose: Read-only default token; every third-party action pinned to a commit SHA.
    status: enforced
    controls: [CTL-010, CTL-011]
    environments:
      local: { use: not-used, why: Workflows run only in CI. }
      nonprod: { use: required, why: The pipeline that deploys non-prod is itself supply-chain surface. }
      prod: { use: required, why: The pipeline that deploys prod is itself supply-chain surface. }
    cost: Free.

  - id: aws-oidc
    name: Short-lived AWS credentials (OIDC)
    kind: practice
    tools: [GitHub OIDC, AWS IAM]
    purpose: CI assumes an IAM role per run; no stored access keys anywhere.
    status: enforced
    controls: [CTL-012]
    environments:
      local: { use: not-used, why: Local never touches AWS. }
      nonprod: { use: required, why: "Only CI deploys, and only with short-lived credentials." }
      prod: { use: required, why: "Only CI deploys, and only with short-lived credentials." }
    cost: Free.

  - id: security-scans
    name: Code, secret and dependency scans
    kind: check
    tools: [Semgrep, detect-secrets, npm audit]
    purpose: The SEC-01 portable scanners, run as a gate in CI and as a report locally.
    status: enforced
    controls: [CTL-013]
    environments:
      local: { use: informational, why: "Agents see findings while building; SECURITY_GATE unset, so they report only (A-13)." }
      nonprod: { use: required, why: "SECURITY_GATE=fail; a finding blocks the image from being built." }
      prod: { use: required, why: Prod promotes only images that passed the non-prod gate. }
    cost: Free.

  - id: sbom
    name: Software bill of materials
    kind: check
    tools: [Syft]
    purpose: An SBOM for every image, kept as evidence.
    status: enforced
    controls: [CTL-014]
    environments:
      local: { use: not-used, why: Generated where images are published. }
      nonprod: { use: required, why: Generated when the image is built. }
      prod: { use: required, why: The same SBOM travels with the promoted image. }
    cost: Free.

  - id: pre-push-verify
    name: Pre-push full-suite verification
    kind: check
    tools: [git hooks, spec/run-all.js]
    purpose: Block a push unless every full-tier suite passed on the exact tree (CI-01).
    status: planned
    environments:
      local: { use: required, why: Catches failures before they reach CI. }
      nonprod: { use: not-used, why: CI reruns everything independently. }
      prod: { use: not-used, why: CI reruns everything independently. }
    cost: Free.

  - id: branch-ruleset
    name: Protected main branch
    kind: practice
    tools: [GitHub rulesets]
    purpose: PR required, guard and delivery checks required, code-owner review (GUARD-01 remote).
    status: enforced
    controls: [CTL-024]
    environments:
      local: { use: not-used, why: "Enforced by GitHub, not locally." }
      nonprod: { use: required, why: Nothing reaches non-prod except through a reviewed merge. }
      prod: { use: required, why: Nothing reaches prod except through a reviewed merge. }
    cost: Free.

  # --- Governance and provenance ------------------------------------------------
  - id: root-of-trust
    name: Human-owned root of trust
    kind: practice
    tools: [guard.yml, CODEOWNERS, spec/guard]
    purpose: The small set of human-owned files that run this spec; agents build everything else (A-20).
    status: enforced
    controls: [CTL-022]
    environments:
      local: { use: required, why: The protect-paths hook stops agents editing the spec. }
      nonprod: { use: required, why: CI's own run of the spec is authoritative. }
      prod: { use: required, why: CI's own run of the spec is authoritative. }
    cost: Free.

  - id: build-provenance
    name: Signed build provenance (SLSA)
    kind: check
    tools: [GitHub artifact attestations]
    purpose: Proves which workflow built which image from which commit.
    status: enforced
    controls: [CTL-020]
    environments:
      local: { use: not-used, why: Local images are never promoted. }
      nonprod: { use: required, why: Created when the image is built. }
      prod: { use: required, why: Verified before deploying. }
    cost: Free.

  - id: ai-provenance
    name: AI provenance attestation
    kind: check
    tools: [GitHub artifact attestations, in-toto]
    purpose: Records which agent and model built the code, under which frozen spec, and who approved it (DC-007).
    status: enforced
    controls: [CTL-021]
    environments:
      local: { use: not-used, why: Local images are never promoted. }
      nonprod: { use: required, why: Created when the image is built. }
      prod: { use: required, why: Verified before deploying. }
    cost: Free.

  - id: prod-approval
    name: Human approval to release
    kind: practice
    tools: [GitHub Environments]
    purpose: "Prod deploys wait for a human reviewer and verify both attestations. Agents work under their own GitHub identity, which is never a reviewer and never an admin (separation of duties between human and agent)."
    status: enforced
    controls: [CTL-023, CTL-025, CTL-026]
    environments:
      local: { use: not-used, why: Nothing is released from local. }
      nonprod: { use: not-used, why: Non-prod deploys automatically on merge so it gives fast feedback. }
      prod: { use: required, why: "An agent can build and test, but only a human can release." }
    cost: Free.

  - id: scp-guardrails
    name: Organization guardrails (SCPs)
    kind: aws-service
    tools: [AWS Organizations]
    purpose: Member accounts cannot leave the org, switch off audit logging, or work outside the region.
    status: enforced
    controls: [CTL-050, CTL-051, CTL-052]
    environments:
      local: { use: not-used, why: No AWS locally. }
      nonprod: { use: required, why: Guardrails apply to every member account. }
      prod: { use: required, why: Guardrails apply to every member account. }
    cost: Free.

  - id: audit-trail
    name: Audit trail and configuration history
    kind: aws-service
    tools: [AWS CloudTrail, AWS Config]
    purpose: An organization trail and configuration recorder; SCPs (CTL-051) stop them being switched off.
    status: planned
    environments:
      local: { use: not-used, why: No AWS locally. }
      nonprod: { use: required, why: Every cloud change is recorded. }
      prod: { use: required, why: Every cloud change is recorded. }
    cost: "One CloudTrail trail is free; AWS Config costs about $0.003 per recorded item. Limit recording to the resource types we use."

  # --- Runtime --------------------------------------------------------------------
  - id: ecs-fargate-tasks
    name: Hardened ECS Fargate tasks
    kind: aws-service
    tools: [Amazon ECS on AWS Fargate]
    purpose: Run each image as a Fargate task, non-root, read-only file system; test endpoints only in non-prod.
    status: enforced
    controls: [CTL-032, CTL-033]
    environments:
      local: { use: not-used, why: Docker Compose runs the images locally. }
      nonprod: { use: required, why: "The same task shape as prod, with test endpoints on." }
      prod: { use: required, why: Test endpoints off. }
    cost: "About $9 per task per month at the smallest size if always on; ephemeral environments are why the system fits the budget."

  - id: secrets-manager
    name: Secrets from Secrets Manager
    kind: aws-service
    tools: [AWS Secrets Manager]
    purpose: AUTH_TOKEN_SECRET is injected by ECS from Secrets Manager, never as plain text.
    status: enforced
    controls: [CTL-034]
    environments:
      local: { use: not-used, why: "Local uses the harness's demo-only value." }
      nonprod: { use: required, why: "No secret in templates, images or logs." }
      prod: { use: required, why: "No secret in templates, images or logs." }
    cost: "$0.40 per secret per month."

  - id: iam-least-privilege
    name: Least-privilege IAM
    kind: practice
    tools: [AWS IAM, CloudFormation Guard]
    purpose: No IAM statement allows "*" or "service:*".
    status: enforced
    controls: [CTL-031]
    environments:
      local: { use: not-used, why: No AWS locally; the template check still runs offline. }
      nonprod: { use: required, why: Over-broad roles are the most common cloud finding. }
      prod: { use: required, why: Over-broad roles are the most common cloud finding. }
    cost: Free.

  - id: network-hardening
    name: Network hardening
    kind: practice
    tools: [Amazon VPC, AWS WAF]
    purpose: Private subnets, WAF, restricted ingress.
    status: deferred
    environments:
      local: { use: not-used, why: Not applicable. }
      nonprod: { use: not-used, why: "Deferred 2026-10-10: test application, no data to protect. See PROJECT-PLAN deferred items." }
      prod: { use: not-used, why: "Deferred 2026-10-10: test application, no data to protect; would also need a NAT gateway or VPC endpoints, which breaks the budget." }

  # --- Observability and telemetry -----------------------------------------------
  - id: otlp-test-collector
    name: OTLP test collector
    kind: tool
    tools: [spec/harness/collector]
    purpose: Receives traces so OBS rules can be asserted (SPEC-03).
    status: enforced
    existing_checks: [spec/tests/observability, spec/tests/harness/collector.test.js]
    environments:
      local: { use: required, why: OBS rules are asserted against real traces. }
      nonprod: { use: not-used, why: Replaced by the AWS collector. }
      prod: { use: not-used, why: Replaced by the AWS collector. }
    cost: Free.

  - id: cloudwatch-logs
    name: Encrypted, expiring container logs
    kind: aws-service
    tools: [Amazon CloudWatch Logs, AWS KMS]
    purpose: Every container logs to a KMS-encrypted log group with retention of 30 days or less.
    status: enforced
    controls: [CTL-030]
    environments:
      local: { use: not-used, why: Compose shows logs on stdout. }
      nonprod: { use: required, why: Logs are audit information (AU-9). }
      prod: { use: required, why: Logs are audit information (AU-9). }
    cost: "$0.50 per GB ingested; a KMS key costs $1 per month."

  - id: cloud-tracing
    name: Traces in the cloud
    kind: aws-service
    tools: [AWS Distro for OpenTelemetry, AWS X-Ray]
    purpose: The same OTLP traces and OBS rules, asserted against the deployed environment.
    status: planned
    environments:
      local: { use: not-used, why: The OTLP test collector covers local. }
      nonprod: { use: required, why: OBS rules run against the deployed environment in the live tier. }
      prod: { use: required, why: Production telemetry. }
    cost: "X-Ray: 100,000 traces per month free."

  - id: structured-logs
    name: Structured JSON logs
    kind: practice
    tools: [services/platform]
    purpose: Machine-readable logs with trace IDs, so logs and traces join up.
    status: planned
    environments:
      local: { use: required, why: Same format everywhere. }
      nonprod: { use: required, why: Same format everywhere. }
      prod: { use: required, why: Same format everywhere. }
    cost: Free.

  - id: slo-alarms
    name: SLOs and alarms
    kind: aws-service
    tools: [Amazon CloudWatch alarms]
    purpose: Latency and error SLOs from real telemetry; also fixes OBS-008 (exporter crash).
    status: planned
    environments:
      local: { use: not-used, why: PERF-01 covers local responsiveness. }
      nonprod: { use: informational, why: Tune alarms before they page anyone. }
      prod: { use: required, why: Prod must say when it is unhealthy. }
    cost: "$0.10 per alarm per month."

  # --- Performance ---------------------------------------------------------------
  - id: local-performance
    name: Local performance thresholds
    kind: check
    tools: [spec/tests/performance]
    purpose: PERF-001 and PERF-002 thresholds on a small concurrent load (A-06).
    status: enforced
    existing_checks: [spec/tests/performance, spec/features/performance/local-demo.feature]
    environments:
      local: { use: required, why: Agents need the signal while building. }
      nonprod: { use: not-used, why: Replaced by the deployed load smoke test. }
      prod: { use: not-used, why: SLOs replace load tests in prod. }
    cost: Free.

  - id: deployed-load-smoke
    name: Deployed load smoke test
    kind: check
    tools: [spec/tests/performance]
    purpose: The PERF-001 workload against the deployed URL, with cloud thresholds.
    status: planned
    environments:
      local: { use: not-used, why: PERF-01 covers local. }
      nonprod: { use: required, why: Finds network and cold-start costs local can't show. }
      prod: { use: not-used, why: No synthetic load in prod. }
    cost: "A few minutes of task time per run."

  # --- Cost ----------------------------------------------------------------------
  - id: no-nat-gateway
    name: No NAT gateway
    kind: practice
    tools: [Amazon VPC]
    purpose: Tasks use public subnets with public IPs; a NAT gateway alone is about $32 per month.
    status: enforced
    controls: [CTL-040]
    environments:
      local: { use: not-used, why: Not applicable. }
      nonprod: { use: required, why: "$25 ceiling." }
      prod: { use: required, why: "$25 ceiling." }
    cost: Saves about $32 per month per environment.

  - id: aws-budgets
    name: Budget alarm
    kind: aws-service
    tools: [AWS Budgets]
    purpose: A $25 monthly cost budget that warns at 80% forecast and 100% actual.
    status: enforced
    controls: [CTL-041]
    environments:
      local: { use: not-used, why: Not applicable. }
      nonprod: { use: required, why: Spend is visible before it surprises anyone. }
      prod: { use: required, why: Spend is visible before it surprises anyone. }
    cost: The first two budgets are free.

  - id: ephemeral-environments
    name: Ephemeral environments with a TTL
    kind: practice
    tools: [GitHub Actions schedule, infra/destroy]
    purpose: "Every billable resource is tagged petclinic:ttl (minutes after creation: non-prod 15, prod 30). The deploying workflow tears non-prod down when its tests finish, pass or fail; a sweep every 5 minutes destroys anything past its TTL." 
    status: enforced
    controls: [CTL-042, CTL-043]
    environments:
      local: { use: not-used, why: Compose down is enough. }
      nonprod: { use: required, why: "Exists only while it is being tested: 15 minutes." }
      prod: { use: required, why: "Up only for a 30-minute promotion window. If nobody is looking at it, it doesn't need to be up." }
    cost: "Turns a fixed monthly bill into cents per test run (about $0.04 for 15 minutes)." 

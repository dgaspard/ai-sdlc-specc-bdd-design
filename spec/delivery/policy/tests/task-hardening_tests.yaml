---
- name: hardened Fargate task passes
  input:
    Resources:
      Task:
        Type: AWS::ECS::TaskDefinition
        Properties:
          RequiresCompatibilities: [ FARGATE ]
          ContainerDefinitions:
            - Name: checkout
              User: "1000:1000"
              ReadonlyRootFilesystem: true
  expectations:
    rules:
      tasks_run_on_fargate: PASS
      containers_are_hardened: PASS

- name: root user fails (calibration plant)
  input:
    Resources:
      Task:
        Type: AWS::ECS::TaskDefinition
        Properties:
          RequiresCompatibilities: [ FARGATE ]
          ContainerDefinitions:
            - Name: checkout
              User: root
              ReadonlyRootFilesystem: true
  expectations:
    rules:
      tasks_run_on_fargate: PASS
      containers_are_hardened: FAIL

- name: writable root file system fails
  input:
    Resources:
      Task:
        Type: AWS::ECS::TaskDefinition
        Properties:
          RequiresCompatibilities: [ FARGATE ]
          ContainerDefinitions:
            - Name: checkout
              User: "1000"
  expectations:
    rules:
      tasks_run_on_fargate: PASS
      containers_are_hardened: FAIL

- name: EC2 launch type fails
  input:
    Resources:
      Task:
        Type: AWS::ECS::TaskDefinition
        Properties:
          RequiresCompatibilities: [ EC2 ]
          ContainerDefinitions:
            - Name: checkout
              User: "1000"
              ReadonlyRootFilesystem: true
  expectations:
    rules:
      tasks_run_on_fargate: FAIL
      containers_are_hardened: PASS

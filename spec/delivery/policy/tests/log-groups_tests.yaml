# cfn-guard unit tests: calibrate each rule with a passing and a failing template.
# Run: npm run policy:test
---
- name: encrypted log group with 14-day retention passes
  input:
    Resources:
      Logs:
        Type: AWS::Logs::LogGroup
        Properties:
          KmsKeyId: arn:aws:kms:us-east-1:111122223333:key/example
          RetentionInDays: 14
  expectations:
    rules:
      log_groups_encrypted_and_expire: PASS
      containers_send_logs_to_cloudwatch: SKIP

- name: unencrypted log group fails (calibration plant)
  input:
    Resources:
      Logs:
        Type: AWS::Logs::LogGroup
        Properties:
          RetentionInDays: 14
  expectations:
    rules:
      log_groups_encrypted_and_expire: FAIL
      containers_send_logs_to_cloudwatch: SKIP

- name: log group that never expires fails
  input:
    Resources:
      Logs:
        Type: AWS::Logs::LogGroup
        Properties:
          KmsKeyId: arn:aws:kms:us-east-1:111122223333:key/example
  expectations:
    rules:
      log_groups_encrypted_and_expire: FAIL
      containers_send_logs_to_cloudwatch: SKIP

- name: container without awslogs fails
  input:
    Resources:
      Task:
        Type: AWS::ECS::TaskDefinition
        Properties:
          ContainerDefinitions:
            - Name: checkout
  expectations:
    rules:
      log_groups_encrypted_and_expire: SKIP
      containers_send_logs_to_cloudwatch: FAIL

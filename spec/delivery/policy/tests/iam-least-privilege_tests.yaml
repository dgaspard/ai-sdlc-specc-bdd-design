---
- name: scoped actions pass
  input:
    Resources:
      Policy:
        Type: AWS::IAM::Policy
        Properties:
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [ "logs:CreateLogStream", "logs:PutLogEvents" ]
                Resource: "*"
  expectations:
    rules:
      no_wildcard_actions_in_policies: PASS
      no_wildcard_actions_in_role_policies: SKIP

- name: wildcard action fails (calibration plant)
  input:
    Resources:
      Policy:
        Type: AWS::IAM::Policy
        Properties:
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: "*"
                Resource: "*"
  expectations:
    rules:
      no_wildcard_actions_in_policies: FAIL
      no_wildcard_actions_in_role_policies: SKIP

- name: service wildcard in a role's inline policy fails
  input:
    Resources:
      Role:
        Type: AWS::IAM::Role
        Properties:
          Policies:
            - PolicyName: too-broad
              PolicyDocument:
                Statement:
                  - Effect: Allow
                    Action: [ "s3:*" ]
                    Resource: "*"
  expectations:
    rules:
      no_wildcard_actions_in_policies: SKIP
      no_wildcard_actions_in_role_policies: FAIL

- name: a wildcard in a Deny statement is allowed
  input:
    Resources:
      Policy:
        Type: AWS::IAM::Policy
        Properties:
          PolicyDocument:
            Statement:
              - Effect: Deny
                Action: "*"
                Resource: "*"
  expectations:
    rules:
      no_wildcard_actions_in_policies: PASS
      no_wildcard_actions_in_role_policies: SKIP
